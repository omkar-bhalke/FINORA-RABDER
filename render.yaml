envVarGroups:
  - name: finora-config
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: LIVE_REPORTS
        value: "false"
      - key: FIREBASE_DATABASE_URL
        value: https://finoraaaaaa-default-rtdb.asia-southeast1.firebasedatabase.app
services:
  - type: web
    name: finora-api
    runtime: node
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - fromGroup: finora-config
  - type: worker
    name: finora-reports
    runtime: node
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run worker
    envVars:
      - fromGroup: finora-config
